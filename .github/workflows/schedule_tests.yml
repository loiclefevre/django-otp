  otp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rdbms: base-database-service-26ai
    runs-on: [ self-hosted, Linux, X64, OracleTestPilot ]
    name: Oracle Test Pilot Tests
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'tests/requirements/py3.txt'
      - name: Install libmemcached-dev for pylibmc
        run: sudo apt-get install -y libmemcached-dev
      - name: Install and upgrade packaging tools
        run: python -m pip install --upgrade pip wheel
      - run: python -m pip install -r tests/requirements/py3.txt -r tests/requirements/oracle.txt -e .

      - id: create_database
        uses: oracle-actions/setup-testpilot@aec84678697e1648ddb8e8a480cf3ceda746ce5c # v1.0.24
        with:
          oci-service: ${{ matrix.rdbms }}
          action: create
          user: django
          connection-string-format: tns

      - name: Remove double quotes from connection string suffix
        run: |
          TESTPILOT_CONNECTION_STRING_SUFFIX=${{ steps.create_database.outputs.connection_string_suffix }}
          TESTPILOT_CONNECTION_STRING_SUFFIX_WDQ=${TESTPILOT_CONNECTION_STRING_SUFFIX:1:-1}
          echo "TESTPILOT_CONNECTION_STRING_SUFFIX=$TESTPILOT_CONNECTION_STRING_SUFFIX_WDQ" >> $GITHUB_ENV
        shell: bash

      - name: Create Oracle settings file
        run: mv ./.github/workflows/data/test_oracle.py.tpl ./tests/test_oracle.py

      - name: Run tests
        env:
          TESTPILOT_USERNAME: django_${{ github.run_number }}
          TESTPILOT_PASSWORD: ${{ steps.create_database.outputs.database_password }}
          TESTPILOT_CONNECTION_STRING_SUFFIX: ${{ env.TESTPILOT_CONNECTION_STRING_SUFFIX }}
          RUNID: ${{ github.run_number }}
          API_HOST: ""
          TESTPILOT_CLIENT_ID: ""
          TESTPILOT_TOKEN: ""
        working-directory: ./tests/
        run: python -Wall runtests.py --settings=test_oracle --verbosity=2

      - uses: oracle-actions/setup-testpilot@aec84678697e1648ddb8e8a480cf3ceda746ce5c # v1.0.24
        if: always()
        with:
          oci-service: ${{ matrix.rdbms }}
          action: delete
          user: django

